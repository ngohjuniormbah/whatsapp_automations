services:
  db:
    image: postgres:16
    container_name: wa_agent_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wa_agent
    ports:
      - "5432:5432"
    volumes:
      - wa_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wa_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wa_agent_pgdata:
